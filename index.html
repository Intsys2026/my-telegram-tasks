<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все активные задачи</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 12px;
        }
        .header {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin: 10px 5px;
            font-weight: 600;
        }
        .card {
            background: #f2f2f7;       
            border: 2px solid #000000;  
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }
        .task-title {
            font-size: 18px;
            font-weight: bold;
            margin: 14px 0 10px 0;
        }
        .info-row {
            font-size: 14px;
            margin: 6px 0;
        }
        .info-label {
            color: #8e8e93;
        }
        .btn-base {
            width: 100%;
            padding: 12px; 
            border: none;
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn-project {
            background: #e5e5ea; 
            color: #0047ab;      
            margin-bottom: 4px;
            text-align: center;
        }
        .btn-project:active {
            background: #d1d1d6;
        }
        .btn-complete {
            background: #34c759;
            color: white;
            margin-top: 14px;
        }
        .btn-complete:active {
            background: #2cb04e;
        }
        .loader {
            text-align: center;
            padding: 40px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <div class="header">Все задачи в работе по всем объектам</div>
    <div id="loader" class="loader">Загрузка списка задач...</div>
    <div id="tasks-container"></div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        async function loadTasks() {
            // Читаем локальный JSON файл, созданный ботом (добавляем случайный параметр, чтобы избежать кэширования браузером)
            const url = `tasks.json?nocache=${Date.now()}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Файл задач еще не сгенерирован ботом.");
                
                const tasks = await response.json();
                const container = document.getElementById('tasks-container');
                document.getElementById('loader').style.display = 'none';
                
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="loader">Нет активных задач ни на одном объекте! 🎉</div>';
                    return;
                }

                // Выводим каждую задачу из общего списка
                tasks.forEach((task) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <button class="btn-base btn-project" onclick="clickProject('${task.project_name}', '${task.project_id}')">${task.project_name}</button>
                        <div class="task-title">${task.task_name}</div>
                        <div class="info-row"><span class="info-label">Описание:</span> ${task.description}</div>
                        <div class="info-row"><span class="info-label">Ответственный:</span> ${task.assignee}</div>
                        <button class="btn-base btn-complete" onclick="confirmTask('${task.project_id}', '${task.row_number}', '${task.task_name.replace(/'/g, "\\'")}')">✅ ЗАВЕРШИТЬ</button>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color: #e74c3c; font-weight: bold;">⚠️ Ошибка: ${error.message}</span>`;
            }
        }

        function clickProject(name, gid) {
            if (!tg) return;
            tg.sendData(JSON.stringify({
                action: "view_project_tasks",
                project_name: name,
                project_id: gid
            }));
            tg.close();
        }

        function confirmTask(projectGid, rowNumber, taskName) {
            if (!tg) return;
            tg.showPopup({
                title: 'Завершение задачи',
                message: `Вы действительно хотите завершить задачу:\n"${taskName}"?`,
                buttons: [
                    {id: 'yes', type: 'ok', text: 'Да, готово'},
                    {id: 'no', type: 'cancel', text: 'Отмена'}
                ]
            }, function(buttonId) {
                if (buttonId === 'yes') {
                    // Передаем точный GID листа и номер строки для Python-обработчика
                    tg.sendData(JSON.stringify({
                        action: "complete_task",
                        project_id: projectGid, 
                        row_number: Number(rowNumber)
                    }));
                    tg.close();
                }
            });
        }

        loadTasks();
    </script>
</body>
</html>
