<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Все активные задачи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 12px;
        }
        .header {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin: 10px 5px;
            font-weight: 600;
        }
        .card {
            background: #f2f2f7;       
            border: 2px solid #000000;  
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }
        .task-title {
            font-size: 18px;
            font-weight: bold;
            margin: 14px 0 10px 0;
        }
        .info-row {
            font-size: 14px;
            margin: 6px 0;
        }
        .info-label {
            color: #8e8e93;
        }
        .btn-base {
            width: 100%;
            padding: 12px; 
            border: none;
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn-project {
            background: #e5e5ea; 
            color: #0047ab;      
            margin-bottom: 4px;
            text-align: center;
        }
        .btn-project:active {
            background: #d1d1d6;
        }
        .btn-complete {
            background: #34c759;
            color: white;
            margin-top: 14px;
        }
        .btn-complete:active {
            background: #2cb04e;
        }
        .loader {
            text-align: center;
            padding: 40px;
            color: #8e8e93;
        }
        /* Индикатор обновления */
        .refresh-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #34c759;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            transform: translateY(-100%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        .refresh-indicator.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Индикатор обновления -->
    <div id="refreshIndicator" class="refresh-indicator">🔄 Обновление...</div>

    <div class="header">Все задачи в работе по всем объектам</div>
    <div id="loader" class="loader">Загрузка списка задач...</div>
    <div id="tasks-container"></div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ============================================
        // ПОЛНОЕ АВТООБНОВЛЕНИЕ
        // ============================================

        let autoRefreshTimer = null;
        let isRefreshing = false;

        // Показываем индикатор обновления
        function showRefreshIndicator() {
            const indicator = document.getElementById('refreshIndicator');
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 1000);
        }

        // Обновление задач (перезагрузка данных без перезагрузки страницы)
        async function refreshTasks() {
            if (isRefreshing) return;
            isRefreshing = true;
            showRefreshIndicator();
            
            const url = `tasks.json?nocache=${Date.now()}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Файл задач еще не сгенерирован");
                
                const tasks = await response.json();
                const container = document.getElementById('tasks-container');
                const loader = document.getElementById('loader');
                
                loader.style.display = 'none';
                
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="loader">Нет активных задач ни на одном объекте! 🎉</div>';
                    return;
                }

                // Очищаем и перерисовываем
                container.innerHTML = '';
                tasks.forEach((task) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <button class="btn-base btn-project" onclick="clickProject('${escapeHtml(task.project_name)}', '${task.project_id}')">${escapeHtml(task.project_name)}</button>
                        <div class="task-title">${escapeHtml(task.task_name)}</div>
                        <div class="info-row"><span class="info-label">Описание:</span> ${escapeHtml(task.description)}</div>
                        <div class="info-row"><span class="info-label">Ответственный:</span> ${escapeHtml(task.assignee)}</div>
                        <button class="btn-base btn-complete" onclick="confirmTask('${task.project_id}', '${task.row_number}', '${escapeHtml(task.task_name).replace(/'/g, "\\'")}')">✅ ЗАВЕРШИТЬ</button>
                    `;
                    container.appendChild(card);
                });
                
                console.log('✅ Задачи обновлены в', new Date().toLocaleTimeString());
                
            } catch (error) {
                console.error('Ошибка обновления:', error);
                document.getElementById('loader').innerHTML = `<span style="color: #e74c3c; font-weight: bold;">⚠️ Ошибка: ${error.message}</span>`;
            } finally {
                isRefreshing = false;
            }
        }

        // Функция защиты от XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================
        // 1. АВТООБНОВЛЕНИЕ ПО ТАЙМЕРУ (каждые 15 секунд)
        // ============================================
        function startAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                refreshTasks();
            }, 15000); // 15 секунд
            console.log('✅ Автообновление включено (каждые 15 секунд)');
        }

        // ============================================
        // 2. PULL-TO-REFRESH (свайп вниз)
        // ============================================
        let startY = 0;
        let isPulling = false;

        document.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isPulling = true;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            const moveY = e.touches[0].clientY - startY;
            if (moveY > 60 && window.scrollY === 0) {
                isPulling = false;
                refreshTasks();
            }
        });

        document.addEventListener('touchend', () => {
            isPulling = false;
        });

        // ============================================
        // 3. ОБНОВЛЕНИЕ ПРИ ВОЗВРАТЕ НА ВКЛАДКУ
        // ============================================
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                refreshTasks();
            }
        });

        // ============================================
        // 4. ОБНОВЛЕНИЕ ПРИ ПРОВЕДЕНИИ ПАЛЬЦЕМ ВНИЗ (доп. вариант для десктопа)
        // ============================================
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const st = window.scrollY;
            if (st === 0 && lastScrollTop > 0 && lastScrollTop < 5) {
                refreshTasks();
            }
            lastScrollTop = st;
        });

        // ============================================
        // ЗАГРУЗКА ПРИ СТАРТЕ
        // ============================================
        async function loadTasks() {
            const url = `tasks.json?nocache=${Date.now()}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Файл задач еще не сгенерирован ботом.");
                
                const tasks = await response.json();
                const container = document.getElementById('tasks-container');
                const loader = document.getElementById('loader');
                
                loader.style.display = 'none';
                
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="loader">Нет активных задач ни на одном объекте! 🎉</div>';
                    return;
                }

                container.innerHTML = '';
                tasks.forEach((task) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <button class="btn-base btn-project" onclick="clickProject('${escapeHtml(task.project_name)}', '${task.project_id}')">${escapeHtml(task.project_name)}</button>
                        <div class="task-title">${escapeHtml(task.task_name)}</div>
                        <div class="info-row"><span class="info-label">Описание:</span> ${escapeHtml(task.description)}</div>
                        <div class="info-row"><span class="info-label">Ответственный:</span> ${escapeHtml(task.assignee)}</div>
                        <button class="btn-base btn-complete" onclick="confirmTask('${task.project_id}', '${task.row_number}', '${escapeHtml(task.task_name).replace(/'/g, "\\'")}')">✅ ЗАВЕРШИТЬ</button>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color: #e74c3c; font-weight: bold;">⚠️ Ошибка: ${error.message}</span>`;
            }
        }

        // Функции для взаимодействия с ботом
        function clickProject(name, gid) {
            if (!tg) return;
            tg.sendData(JSON.stringify({
                action: "view_project_tasks",
                project_name: name,
                project_id: gid
            }));
            tg.close();
        }

        function confirmTask(projectGid, rowNumber, taskName) {
            if (!tg) return;
            tg.showPopup({
                title: 'Завершение задачи',
                message: `Вы действительно хотите завершить задачу:\n"${taskName}"?`,
                buttons: [
                    {id: 'yes', type: 'ok', text: 'Да, готово'},
                    {id: 'no', type: 'cancel', text: 'Отмена'}
                ]
            }, function(buttonId) {
                if (buttonId === 'yes') {
                    tg.sendData(JSON.stringify({
                        action: "complete_task",
                        project_id: projectGid, 
                        row_number: Number(rowNumber)
                    }));
                    tg.close();
                }
            });
        }

        // Запускаем всё
        loadTasks();
        startAutoRefresh();
    </script>
</body>
</html>
